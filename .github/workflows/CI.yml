name: CI my first pipeline

on:
  push:
    branches: ["main"]

jobs:
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: Install Client Depen
        working-directory: client
        run: npm ci

      - name: Install server Depen
        working-directory: server
        run: npm ci
        
